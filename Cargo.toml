[package]
name = "pg2sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
sqlparser = { version = "0.62", default-features = false, features = ["visitor"] }
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", rev = "858e17e4561c2b80d779674192d242bcb12f8afa", default-features = false }
git2 = { version = "0.20.4", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", default-features = false }
# Optional Arbitrary impls on the public option types so fuzz harnesses
# can drive `Pg2SqliteOptions` (and its dependent enums) from libfuzzer
# input bytes. Gated behind the `arbitrary` feature so production
# builds don't pull the dep.
arbitrary = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
diesel = { version = "2.3.9", features = ["sqlite"] }
insta = "1.47.2"
polyglot-sql = "0.3.11"
rosetta-uuid = { version = "0.1.2", features = ["diesel", "sqlite"] }
rusqlite = { version = "0.35", features = ["bundled", "functions"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8.48"
rand = "0.10.1"

# Optional integration gated by the `sqlitegis` feature. Declared in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo only honors
# `optional = true` on regular dependencies. Still test-only: nothing
# in `src/` references it unless `feature = "sqlitegis"` is set. The
# crate replaces the older `geolite-core`/`geolite-sqlite`/`geolite-diesel`
# split now that SQLiteGIS ships as a single published crate.
[dependencies.sqlitegis]
version = "0.1.0"
default-features = false
features = ["sqlite", "diesel-sqlite"]
optional = true

[dependencies.libsqlite3-sys]
version = "0.33"
optional = true

[features]
# Default feature: pulls in everything that depends on the host environment
# (filesystem-backed loaders, git-backed loaders, std-bound error variants,
# and the `recursive-protection` stack guard from sqlparser). Drop this with
# `--no-default-features` to build for `wasm32-unknown-unknown` or other
# no_std targets. See docs/sqlparser_derive_no_std_fix.md for the upstream
# patch that makes `sqlparser/visitor` no_std-compatible.
default = ["std"]
std = [
    "sqlparser/std",
    "sqlparser/recursive-protection",
    "sql-traits/std",
    "thiserror/std",
    "dep:git2",
    "dep:tempfile",
]
# SQLiteGIS Diesel + native-SQLite spatial integration is native-only,
# so it implies `std`.
sqlitegis = [
    "std",
    "dep:sqlitegis",
    "dep:libsqlite3-sys",
]
# Derives `Arbitrary` on `Pg2SqliteOptions`, `UuidRepresentation`,
# `SessionVariablePattern`, and `SessionVariableMapping`. Consumed by
# the fuzz harnesses; not used by production code.
arbitrary = ["dep:arbitrary"]

# Temporary patch: redirect sqlparser + sqlparser_derive to
# LucaCappelletti94's fork at the `pathological-combined` branch (rev
# ce62a47474...). The branch bundles four still-in-flight upstream
# improvements that we depend on:
#   1. PR #2343 (MERGED) - make the `visitor` feature `no_std`-compatible
#      so the crate builds for wasm32-unknown-unknown.
#   2. PR #2344 (MERGED) - fix exponential parse time on compound chains.
#   3. PR #2349 (OPEN)   - fix exponential parse time on named-arg chains.
#   4. PR #2350 (OPEN)   - fix exponential parse time on compound keyword chains.
# We pin a specific rev so cargo cannot silently roll the branch forward.
# Remove this block once a patched sqlparser release ships with all four
# upstream. See docs/sqlparser_derive_no_std_fix.md.
[patch.crates-io]
sqlparser = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }
sqlparser_derive = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }

[[bench]]
name = "translation"
harness = false

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
approx_constant = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
