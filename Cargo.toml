[package]
name = "pg2sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlparser = { version = "0.61", git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", rev = "1d5a6d7e31358daf68362a2078a3a17cfdfed549" }
git2 = "0.20.4"
tempfile = "3.25"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
diesel = { version = "2.3.5", features = ["sqlite"] }
insta = "1.46.3"
rosetta-uuid = { version = "0.1", features = ["diesel", "sqlite"] }
rusqlite = { version = "0.35", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = "0.8"
rand = "0.10"

[[bench]]
name = "translation"
harness = false

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
approx_constant = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
