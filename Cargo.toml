[package]
name = "pg2sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
sqlparser = { version = "0.62", default-features = false, features = ["visitor"] }
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", rev = "858e17e4561c2b80d779674192d242bcb12f8afa", default-features = false }
git2 = { version = "0.20.4", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
diesel = { version = "2.3.9", features = ["sqlite"] }
insta = "1.47.2"
polyglot-sql = "0.1.7"
rosetta-uuid = { version = "0.1.2", features = ["diesel", "sqlite"] }
rusqlite = { version = "0.35", features = ["bundled"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8.48"
rand = "0.10.1"

# Optional integrations gated by the `geolite` feature. Declared in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo only honors
# `optional = true` on regular dependencies. They are still test-only:
# nothing in `src/` references them unless `feature = "geolite"` is set.
[dependencies.geolite-core]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
optional = true

[dependencies.geolite-sqlite]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
optional = true

[dependencies.geolite-diesel]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
features = ["sqlite"]
optional = true

[dependencies.libsqlite3-sys]
version = "0.33"
optional = true

[features]
# Default feature: pulls in everything that depends on the host environment
# (filesystem-backed loaders, git-backed loaders, std-bound error variants,
# and the `recursive-protection` stack guard from sqlparser). Drop this with
# `--no-default-features` to build for `wasm32-unknown-unknown` or other
# no_std targets. See docs/sqlparser_derive_no_std_fix.md for the upstream
# patch that makes `sqlparser/visitor` no_std-compatible.
default = ["std"]
std = [
    "sqlparser/std",
    "sqlparser/recursive-protection",
    "sql-traits/std",
    "thiserror/std",
    "dep:git2",
    "dep:tempfile",
]
# `geolite` (Diesel + sqlite-vec spatial integration) is native-only,
# so it implies `std`.
geolite = [
    "std",
    "dep:geolite-core",
    "dep:geolite-sqlite",
    "dep:geolite-diesel",
    "dep:libsqlite3-sys",
]

# Temporary patch: redirect sqlparser + sqlparser_derive to
# LucaCappelletti94's fork at the `visitor-wasm` branch (rev
# b14285d1d03e8f859f403b5430843c933531be9e) while
# https://github.com/LucaCappelletti94/sqlparser-rs/tree/visitor-wasm is
# under review upstream. The fork makes the `visitor` feature
# wasm32-unknown-unknown-buildable via two fixes:
#   1. derive/src/visit.rs: emit `::core::ops::ControlFlow` instead of
#      `::std::ops::ControlFlow`.
#   2. src/ast/visitor.rs: bring `alloc::{Box, String, Vec}` into scope
#      under `#[cfg(not(feature = "std"))]` so the blanket `Visit`/`VisitMut`
#      impls on those types resolve under no_std.
# The branch also carries upstream-main drift past the v0.62.0 release;
# we pin to a specific rev so cargo cannot silently roll the branch
# forward. See docs/sqlparser_derive_no_std_fix.md. Remove this block
# once a patched sqlparser (>= 0.63 with the no_std fix backported)
# lands on crates.io.
[patch.crates-io]
sqlparser = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "b14285d1d03e8f859f403b5430843c933531be9e" }
sqlparser_derive = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "b14285d1d03e8f859f403b5430843c933531be9e" }

[[bench]]
name = "translation"
harness = false

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
approx_constant = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
