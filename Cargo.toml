[package]
name = "pg2sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
sqlparser = { version = "0.62", features = ["visitor"] }
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", rev = "858e17e4561c2b80d779674192d242bcb12f8afa" }
git2 = "0.20.4"
tempfile = "3.27"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
diesel = { version = "2.3.9", features = ["sqlite"] }
insta = "1.47.2"
polyglot-sql = "0.1.7"
rosetta-uuid = { version = "0.1.2", features = ["diesel", "sqlite"] }
rusqlite = { version = "0.35", features = ["bundled"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8.48"
rand = "0.10.1"

# Optional integrations gated by the `geolite` feature. Declared in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo only honors
# `optional = true` on regular dependencies. They are still test-only:
# nothing in `src/` references them unless `feature = "geolite"` is set.
[dependencies.geolite-core]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
optional = true

[dependencies.geolite-sqlite]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
optional = true

[dependencies.geolite-diesel]
git = "https://github.com/LucaCappelletti94/geolite"
rev = "53cdc1123837bd2e91bcb33c5fa904ecebcd955a"
features = ["sqlite"]
optional = true

[dependencies.libsqlite3-sys]
version = "0.33"
optional = true

[features]
geolite = [
    "dep:geolite-core",
    "dep:geolite-sqlite",
    "dep:geolite-diesel",
    "dep:libsqlite3-sys",
]

[[bench]]
name = "translation"
harness = false

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
approx_constant = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
