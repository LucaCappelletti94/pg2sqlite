# Typos configuration
# https://github.com/crate-ci/typos

[default]
extend-ignore-re = [
    # Ignore hex strings
    "[0-9a-fA-F]{32,}",
]

[default.extend-words]
# Add words that should not be flagged as typos
INSERTs = "INSERTs"

[files]
extend-exclude = [
    "target/",
    "*.snap",
    "Cargo.lock",
]
