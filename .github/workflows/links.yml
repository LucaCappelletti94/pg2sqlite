name: Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all markdown and rust files
          args: >-
            --verbose
            --no-progress
            --exclude '^https://codecov\.io/gh/LucaCappelletti94/pg2sqlite(?:/.*)?$'
            './**/*.md'
            './**/*.rs'
          # Fail the action if broken links are found
          fail: true
