name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only, and rustsec/audit-check
    # publishes its findings as a check run, so the job has to ask for that scope
    # explicitly or the step dies with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
