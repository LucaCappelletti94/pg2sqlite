name: Upstream Heads

# The committed lockfile pins `sql-traits` and `sqlparser` to exact revisions,
# but a consumer resolving the named branches gets their current heads and
# therefore different code. This job builds what such a consumer would build,
# so an upstream change that breaks the next consumer resolution fails here
# rather than downstream. The schedule catches upstream drift while this
# repository is quiet.

on:
  schedule:
    - cron: "37 5 * * *" # Run daily
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  branch-heads:
    name: Consumer Resolution (branch heads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-heads-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-heads-

      # Only the runner's working copy of the lockfile moves. The committed
      # pins stay authoritative for every other job.
      - name: Move the git pins to their branch heads
        run: cargo update -p sql-traits -p sqlparser

      - name: Build the consumer resolution
        run: cargo check --all-targets --all-features
