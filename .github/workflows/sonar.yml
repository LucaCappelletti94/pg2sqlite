name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Neither a fork's pull request nor a Dependabot run can read SONAR_TOKEN,
    # so the scan runs for same-repo human branches and pushes to main only.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: new-code detection and blame need more than a
          # shallow clone.
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=lucacappelletti94-github
            -Dsonar.projectKey=LucaCappelletti94_pg2sqlite
