# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common permissive licenses used by the Rust ecosystem.
# Unicode-3.0 is used by ICU crates (transitive via git2 -> url -> idna).
# GPL-3.0 (deprecated SPDX form) covers sql_docs (transitive via sql-traits).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0",
]

[bans]
# Warn on multiple versions of the same crate rather than blocking CI.
multiple-versions = "warn"
# Git dependencies without a version specifier are intentionally used in this
# project (sqlparser and sql-traits track upstream git branches).
wildcards = "allow"

[advisories]
# Check for known security vulnerabilities.
ignore = [
    # RUSTSEC-2026-0183 / -0184: git2 `Remote::list()` and buffer-created
    # `BlameHunk` signatures can dereference null pointers. pg2sqlite only
    # uses `git2::Repository` (verified via grep) and never calls those
    # APIs, and sql-traits still pins git2 0.20 so bumping ours alone
    # cannot clear them. Drop these once the tree moves to a fixed git2.
    { id = "RUSTSEC-2026-0183", reason = "Remote::list not used in this tree" },
    { id = "RUSTSEC-2026-0184", reason = "Blame APIs not used in this tree" },
]

[sources]
# Allow git sources since the project uses git dependencies for sqlparser and sql-traits.
unknown-registry = "warn"
unknown-git = "allow"
