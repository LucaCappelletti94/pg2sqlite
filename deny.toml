# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common permissive licenses used by the Rust ecosystem.
# Unicode-3.0 is used by ICU crates (transitive via git2 -> url -> idna).
# GPL-3.0 (deprecated SPDX form) covers sql_docs (transitive via sql-traits).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0",
]

[bans]
# Warn on multiple versions of the same crate rather than blocking CI.
multiple-versions = "warn"
# Git dependencies without a version specifier are intentionally used in this
# project (sqlparser and sql-traits are pinned via git rev / branch).
wildcards = "allow"

[advisories]
# Check for known security vulnerabilities.
ignore = [
    # RUSTSEC-2026-0172: diesel `SqliteConnection::deserialize_readonly_database`
    # may operate on freed memory when the buffer is dropped before the
    # connection. We do not call that API anywhere in this crate (verified
    # via grep), so the advisory does not apply. Drop this entry when a
    # fixed diesel release ships and the lockfile picks it up.
    { id = "RUSTSEC-2026-0172", reason = "API not used in this crate" },
]

[sources]
# Allow git sources since the project uses git dependencies for sqlparser and sql-traits.
unknown-registry = "warn"
unknown-git = "allow"
