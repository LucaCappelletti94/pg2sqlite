# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common permissive licenses used by the Rust ecosystem
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"

[advisories]
# Check for known security vulnerabilities
ignore = []

[sources]
# Allow git sources since the project uses git dependencies for sqlparser and sql-traits
unknown-registry = "warn"
unknown-git = "allow"
